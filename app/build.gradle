plugins { id 'com.android.application' }
android {
  namespace 'com.zyw.gloss'; compileSdk 34
  defaultConfig { applicationId 'com.zyw.gloss'; minSdk 27; targetSdk 34; versionCode 5; versionName "0.3.0" }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
}
dependencies {
  compileOnly 'de.robv.android.xposed:api:82'
  implementation 'com.google.android.material:material:1.12.0'
}
android { androidResources { noCompress 'gz' }; packaging { resources { excludes += ['**/*.kotlin_builtins'] } } }
