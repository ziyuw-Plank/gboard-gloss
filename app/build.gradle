plugins { id 'com.android.application' }
android {
  namespace 'io.github.ziyuw_plank.gboardgloss'; compileSdk 34
  defaultConfig { applicationId 'io.github.ziyuw_plank.gboardgloss'; minSdk 27; targetSdk 34; versionCode 10; versionName "0.5.1"; ndk { abiFilters "arm64-v8a", "armeabi-v7a" } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
}
dependencies {
  compileOnly 'de.robv.android.xposed:api:82'
  implementation 'com.google.android.material:material:1.12.0'
  implementation 'com.google.mlkit:translate:17.0.3'
}
android { androidResources { noCompress 'gz' }; packaging { jniLibs { useLegacyPackaging true }; resources { excludes += ['**/*.kotlin_builtins'] } } }
