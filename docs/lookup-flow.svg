<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Offline-first lookup flow</title>
  <desc id="desc">Glossary then offline dictionaries then optional online fill-in</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/>
    </marker>
  </defs>
  <rect width="720" height="460" fill="#F8FAFC"/>
  <text x="24" y="36" font-family="Roboto,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#202124">Lookup flow · 查词流程</text>
  <text x="24" y="58" font-family="Roboto,Segoe UI,sans-serif" font-size="12" fill="#5F6368">Offline-first · optional online (default off)</text>

  <rect x="260" y="80" width="200" height="48" rx="14" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="360" y="110" text-anchor="middle" font-family="Roboto,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#174EA6">Candidate text</text>

  <line x1="360" y1="128" x2="360" y2="158" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="160" width="240" height="48" rx="14" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
  <text x="360" y="182" text-anchor="middle" font-family="Roboto,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#B06000">1. Domain glossary</text>
  <text x="360" y="198" text-anchor="middle" font-family="Roboto,Segoe UI,sans-serif" font-size="11" fill="#B06000">内置 / 用户导入词表 · exact</text>

  <line x1="360" y1="208" x2="360" y2="238" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="230" font-family="Roboto,Segoe UI,sans-serif" font-size="11" fill="#5F6368">miss</text>

  <rect x="240" y="240" width="240" height="48" rx="14" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="360" y="262" text-anchor="middle" font-family="Roboto,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#137333">2. Offline dictionaries</text>
  <text x="360" y="278" text-anchor="middle" font-family="Roboto,Segoe UI,sans-serif" font-size="11" fill="#137333">CEDICT / JMdict / FreeDict · cached</text>

  <line x1="360" y1="288" x2="360" y2="318" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="310" font-family="Roboto,Segoe UI,sans-serif" font-size="11" fill="#5F6368">miss + online ON</text>

  <rect x="240" y="320" width="240" height="48" rx="14" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="360" y="342" text-anchor="middle" font-family="Roboto,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#C5221F">3. Online fill-in (optional)</text>
  <text x="360" y="358" text-anchor="middle" font-family="Roboto,Segoe UI,sans-serif" font-size="11" fill="#C5221F">async · rate-limited · never blocks draw</text>

  <line x1="480" y1="184" x2="560" y2="184" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="264" x2="560" y2="264" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="344" x2="560" y2="344" stroke="#34A853" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="560" y="220" width="120" height="88" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="620" y="258" text-anchor="middle" font-family="Roboto,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#202124">Show gloss</text>
  <text x="620" y="278" text-anchor="middle" font-family="Roboto,Segoe UI,sans-serif" font-size="11" fill="#5F6368">or leave empty</text>
  <text x="620" y="294" text-anchor="middle" font-family="Roboto,Segoe UI,sans-serif" font-size="11" fill="#5F6368">宁可空着</text>

  <text x="360" y="420" text-anchor="middle" font-family="Roboto,Segoe UI,sans-serif" font-size="11" fill="#5F6368">No poor segmentation stitches · 不做劣质切分拼接</text>
  <text x="360" y="440" text-anchor="middle" font-family="Roboto,Segoe UI,sans-serif" font-size="11" fill="#5F6368">Online default OFF · 在线默认关闭，省电</text>
</svg>
